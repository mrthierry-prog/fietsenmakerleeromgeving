
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fietsenmaker Academie</title>
<style>
:root {
  --bg:#171a1f; --sidebar:#1e2329; --panel:#242a31;
  --panel2:#2c333b; --orange:#f28c28; --white:#f4f5f6;
  --muted:#9ba5af; --border:#363e47; --green:#75bd8b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--white);font-family:Arial,"Segoe UI",sans-serif}
button,input,textarea{font:inherit}
.app{display:flex;min-height:100vh}
.sidebar{width:260px;background:var(--sidebar);border-right:1px solid var(--border);padding:22px 14px;flex-shrink:0}
.logo{padding:8px 12px 24px;border-bottom:1px solid var(--border);margin-bottom:18px}
.logo strong{font-size:20px;letter-spacing:1px}
.logo strong span{color:var(--orange)}
.logo small{display:block;color:var(--muted);font-size:9px;letter-spacing:1.8px;margin-top:7px}
.nav-label{color:#77818b;font-size:10px;font-weight:bold;letter-spacing:1.5px;padding:12px}
.nav-button{width:100%;border:0;background:transparent;color:#c6cdd4;text-align:left;padding:12px;border-radius:7px;cursor:pointer;font-size:13px;margin:2px 0;display:flex;align-items:center;gap:12px}
.nav-button:hover{background:var(--panel2)}
.nav-button.active{background:#3b3025;color:var(--orange);font-weight:bold}
.nav-icon{width:20px;text-align:center;font-size:16px}
.main{flex:1;min-width:0}
.topbar{height:68px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 30px;background:#1c2025}
.topbar-left{display:flex;align-items:center;gap:14px;color:var(--muted);font-size:12px}
.topbar-right{color:var(--orange);font-size:11px;font-weight:bold;letter-spacing:1px}
.content{padding:32px;max-width:1450px;margin:auto}
h1{font-size:27px;margin:0 0 8px}
h2{font-size:17px;margin:0 0 15px}
h3{font-size:14px;margin:0 0 9px}
.subtitle{font-size:13px;color:var(--muted);margin:0 0 27px;line-height:1.6}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:21px}
.muted{color:var(--muted);font-size:12px;line-height:1.7}
.hero{background:linear-gradient(115deg,#303740,#22282f);border:1px solid #414a54;border-left:4px solid var(--orange);border-radius:12px;padding:30px;margin-bottom:20px}
.eyebrow{font-size:10px;color:var(--orange);font-weight:bold;letter-spacing:2px}
.hero h1{margin:13px 0;font-size:29px}
.hero p{color:#b7c0c9;font-size:13px;line-height:1.7;max-width:540px}
.grid{display:grid;gap:16px}
.grid-two{grid-template-columns:1.4fr 1fr}
.grid-three{grid-template-columns:repeat(3,minmax(0,1fr))}
.section{margin:27px 0}
.section-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.section-heading h2{margin:0}
.progress-number{font-size:35px;font-weight:bold;color:var(--orange)}
.progress-track{height:8px;background:#414952;border-radius:20px;overflow:hidden;margin:15px 0 9px}
.progress-fill{height:100%;background:var(--orange);border-radius:20px}
.stat-line{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}
.tile{background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:19px;cursor:pointer;min-height:145px}
.tile:hover{border-color:var(--orange)}
.tile-icon{font-size:26px;margin-bottom:14px}
.tile h3{margin-bottom:7px}
.tile p{font-size:12px;color:var(--muted);line-height:1.6;margin:0 0 12px}
.orange-button{background:var(--orange);color:#171a1f;border:0;border-radius:6px;padding:10px 14px;font-weight:bold;font-size:12px;cursor:pointer}
.orange-button:hover{background:#ffa344}
.secondary-button{background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:9px 12px;font-size:12px;cursor:pointer}
.secondary-button:hover{border-color:var(--orange);color:var(--orange)}
.mobile-menu{display:none;background:transparent;border:1px solid var(--border);color:white;border-radius:6px;padding:8px 10px;cursor:pointer}
.page-heading{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:24px}
.page-heading .subtitle{margin-bottom:0}
.page-list{display:grid;gap:10px}
.lesson-card{padding:17px;background:var(--panel);border:1px solid var(--border);border-radius:9px;display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer}
.lesson-card:hover{border-color:var(--orange)}
.lesson-card h3{margin:0 0 6px}
.lesson-card p{margin:0;color:var(--muted);font-size:11px}
.lesson-number{width:40px;height:40px;display:grid;place-items:center;background:#453322;color:var(--orange);border-radius:8px;flex-shrink:0;font-weight:bold}
.lesson-card-left{display:flex;align-items:center;gap:13px;min-width:0}
.tag{font-size:10px;color:var(--orange);background:#443222;padding:5px 8px;border-radius:20px;white-space:nowrap}
.empty{padding:35px;text-align:center;color:var(--muted);font-size:12px;line-height:1.8}
.form-field{margin:17px 0}
.form-field label{display:block;font-size:12px;font-weight:bold;margin-bottom:8px;color:#e2e5e8}
.form-field small{display:block;color:var(--muted);font-size:11px;margin-top:6px}
.form-field input,.form-field textarea{width:100%;background:#1b2026;border:1px solid var(--border);border-radius:7px;color:white;padding:12px;font-size:13px;outline:none}
.form-field input:focus,.form-field textarea:focus{border-color:var(--orange)}
.form-field textarea{min-height:130px;resize:vertical;line-height:1.6}
.form-field textarea.large{min-height:190px}
.editor-section{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:20px;margin:16px 0}
.editor-section-head{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.editor-icon{width:34px;height:34px;border-radius:7px;background:#453322;color:var(--orange);display:grid;place-items:center}
.editor-section-head h3{margin:0}
.editor-section-head small{display:block;color:var(--muted);font-size:10px;margin-top:4px}
.lesson-view-section{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:22px;margin:16px 0}
.lesson-view-section h2{display:flex;align-items:center;gap:10px}
.lesson-view-section p{font-size:13px;line-height:1.8;color:#d2d7dc;white-space:pre-wrap}
.lesson-images{display:flex;flex-wrap:wrap;gap:12px;margin-top:15px}
.lesson-images img{width:190px;height:140px;object-fit:cover;border-radius:7px;border:1px solid var(--border)}
.image-item{position:relative}
.image-item button{position:absolute;top:5px;right:5px;background:#171a1fdd;color:white;border:0;border-radius:5px;padding:5px 8px;cursor:pointer}
.completion{display:flex;align-items:center;gap:12px;padding:18px;background:#26362d;border:1px solid #42604a;border-radius:9px;margin-top:20px}
.completion input{accent-color:var(--green);width:18px;height:18px}
.completion label{font-size:13px;color:#b9dfc3;cursor:pointer}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.back-button{white-space:nowrap}
@media(max-width:1000px){.grid-three{grid-template-columns:repeat(2,1fr)}}
@media(max-width:800px){
.sidebar{position:fixed;z-index:20;top:0;bottom:0;left:-275px;overflow:auto;transition:left .25s}
.sidebar.show{left:0}
.mobile-menu{display:block}
.content{padding:22px 16px}
.topbar{padding:0 16px}
.grid-two,.grid-three{grid-template-columns:1fr}
}
@media(max-width:480px){
.hero{padding:22px}
.hero h1{font-size:23px}
.page-heading{align-items:flex-start;flex-direction:column}
.lesson-card{align-items:flex-start}
}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="logo">
    <strong><span>⚙</span> FIETSA CADEMIE</strong>
    <small>MIJN PERSOONLIJKE LEEROMGEVING</small>
  </div>
  <div class="nav-label">HOOFDMENU</div>
  <nav id="navigation"></nav>
</aside>
<main class="main">
  <header class="topbar">
    <div class="topbar-left">
      <button class="mobile-menu" onclick="toggleMenu()">☰</button>
      <span>Mijn fietsenmaker leeromgeving</span>
    </div>
    <div class="topbar-right">● MIJN ACADEMIE</div>
  </header>
  <div class="content" id="page"></div>
</main>
</div>

<script>
const menu = [
 ["dashboard","⌂","Dashboard"],
 ["opleiding","▤","Mijn opleiding"],
 ["techniek","⚙","Fietstechniek"],
 ["reparaties","🔧","Reparaties"],
 ["notities","▧","Mijn notities"],
 ["praktijk","🛠","Praktijk & werkzaamheden"],
 ["planning","▦","Planning & voortgang"],
 ["oefenen","✎","Oefenen & toetsen"],
 ["bestanden","▣","Bestanden"]
];

const subpages = {
 reparaties:["Reparatiehandleidingen","Stappenplannen","Benodigd gereedschap","Reparaties per fietsonderdeel","Mijn uitgevoerde reparaties"],
 notities:["Al mijn notities","Samenvattingen","Technische aantekeningen"],
 praktijk:["Mijn werkzaamheden","Vaardighedenoverzicht","Mijn praktijkervaring"],
 planning:["Mijn weekplanning","Mijn takenlijst","Mijn leerdoelen","Cursusvoortgang"],
 oefenen:["Flashcards","Mijn toetsresultaten"],
 bestanden:["Alle bestanden","Afbeeldingen","Mijn documenten"]
};

const techniek = [
 ["Fietstypen","🚲","Stadsfietsen, racefietsen, mountainbikes en meer."],
 ["Aandrijving & versnellingen","⚙️","Ketting, tandwielen, derailleurs en versnellingen."],
 ["Remsystemen","◉","Schijfremmen, velgremmen en remtechniek."],
 ["Wielen & banden","◎","Wielopbouw, spaken, naven en banden."],
 ["Elektrische fietstechniek","⚡","Motoren, accu's, sensoren en elektronica."],
 ["Frames & constructie","▱","Framebouw, materialen en verbindingen."]
];

let currentPage="dashboard";
let currentLessonId=null;
let lessons=JSON.parse(localStorage.getItem("fietsacademie_data_v3")||"null")||[];
let completed=JSON.parse(localStorage.getItem("fietsCompleted")||"[]");

function saveData(){
 localStorage.setItem("fietsacademie_data_v3",JSON.stringify(lessons));
 localStorage.setItem("fietsCompleted",JSON.stringify(completed));
}
function migrateOldData(){
 if(lessons.length) return;
 const old=JSON.parse(localStorage.getItem("fietsChapters")||"[]");
 old.forEach(chapter=>{
  (chapter.lessons||[]).forEach(oldLesson=>{
   lessons.push({
    id:oldLesson.id||makeId(),
    title:oldLesson.name||"Nieuwe les",
    description:"",
    learning:"",
    material:"",
    exercises:"",
    homework:"",
    summary:"",
    images:[],
    done:completed.includes(oldLesson.id)
   });
  });
 });
 if(lessons.length)saveData();
}
function makeId(){return "les-"+Date.now()+"-"+Math.random().toString(36).slice(2)}
function doneCount(){return lessons.filter(l=>l.done).length}
function progress(){return lessons.length?Math.round(doneCount()/lessons.length*100):0}
function drawNavigation(){
 document.getElementById("navigation").innerHTML=menu.map(item=>`
 <button class="nav-button ${currentPage===item[0]?"active":""}" onclick="openPage('${item[0]}')">
 <span class="nav-icon">${item[1]}</span>${item[2]}</button>`).join("");
}
function openPage(page){
 currentPage=page;currentLessonId=null;drawNavigation();renderPage();
 document.getElementById("sidebar").classList.remove("show");
 window.scrollTo(0,0);
}
function toggleMenu(){document.getElementById("sidebar").classList.toggle("show")}

function renderDashboard(){
 return `
 <div class="hero">
  <div class="eyebrow">MIJN DIGITALE LEEROMGEVING</div>
  <h1>Welkom in jouw fietsenmakeracademie!</h1>
  <p>Jouw persoonlijke plek om alles te leren over fietstechniek, onderdelen, onderhoud en reparaties. Bouw stap voor stap jouw kennis en vaardigheden op.</p>
 </div>
 <div class="grid grid-two">
  <div class="panel">
   <h2>Mijn opleidingsvoortgang</h2>
   <div class="progress-number">${progress()}%</div>
   <div class="progress-track"><div class="progress-fill" style="width:${progress()}%"></div></div>
   <div class="stat-line"><span>${doneCount()} afgeronde lessen</span><span>${lessons.length} lessen totaal</span></div>
  </div>
  <div class="panel">
   <h2>Verder leren</h2>
   <p class="muted">Ga verder met jouw persoonlijke fietsenmakercursus.</p>
   <button class="orange-button" onclick="openPage('opleiding')">Mijn lessen openen →</button>
  </div>
 </div>
 <div class="section">
  <div class="section-heading"><h2>Ontdek jouw leeromgeving</h2></div>
  <div class="grid grid-three">
   ${[
    ["opleiding","📚","Mijn opleiding","Jouw lessen en lesmateriaal."],
    ["techniek","⚙️","Fietstechniek","Ontdek de techniek achter fietsen."],
    ["reparaties","🔧","Reparaties","Handleidingen en stappenplannen."],
    ["notities","📝","Mijn notities","Bewaar jouw eigen aantekeningen."],
    ["oefenen","✏️","Oefenen & toetsen","Oefenopgaven en toetsresultaten."],
    ["planning","📅","Planning & voortgang","Organiseer jouw leerproces."]
   ].map(x=>`<div class="tile" onclick="openPage('${x[0]}')"><div class="tile-icon">${x[1]}</div><h3>${x[2]}</h3><p>${x[3]}</p></div>`).join("")}
  </div>
 </div>`;
}

function renderPage(){
 const target=document.getElementById("page");
 if(currentPage==="dashboard"){target.innerHTML=renderDashboard();return;}
 if(currentPage==="opleiding"){renderLessons();return;}
 if(currentPage==="techniek"){
  target.innerHTML=`<h1>Fietstechniek</h1><p class="subtitle">Ontdek de techniek achter verschillende soorten fietsen.</p>
  <div class="grid grid-three">${techniek.map((x,i)=>`<div class="tile" onclick="openTopic(${i})"><div class="tile-icon">${x[1]}</div><h3>${x[0]}</h3><p>${x[2]}</p></div>`).join("")}</div>`;
  return;
 }
 const item=menu.find(x=>x[0]===currentPage);
 const pages=subpages[currentPage]||[];
 target.innerHTML=`<h1>${item?item[2]:"Mijn leeromgeving"}</h1><p class="subtitle">Jouw persoonlijke overzicht.</p>
 <div class="grid grid-three">${pages.map((name,i)=>`<div class="tile"><div class="tile-icon">▤</div><h3>${name}</h3><p>Dit onderdeel gaan we later verder ontwikkelen.</p></div>`).join("")}</div>`;
}

function renderLessons(){
 document.getElementById("page").innerHTML=`
 <div class="page-heading">
  <div><h1>Mijn opleiding</h1><p class="subtitle">Al jouw lessen overzichtelijk bij elkaar. Open een les om je eigen lesmateriaal te maken.</p></div>
  <button class="orange-button" onclick="addLesson()">+ Nieuwe les</button>
 </div>
 <div class="panel">
  <div class="section-heading"><h2>Mijn lessen</h2><span class="tag">${progress()}% afgerond</span></div>
  <div class="progress-track"><div class="progress-fill" style="width:${progress()}%"></div></div>
  <div class="stat-line"><span>${doneCount()} afgerond</span><span>${lessons.length} lessen</span></div>
 </div>
 <div class="section page-list">
 ${lessons.length?lessons.map((l,i)=>`
  <div class="lesson-card" onclick="openLesson('${l.id}')">
   <div class="lesson-card-left">
    <div class="lesson-number">${String(i+1).padStart(2,"0")}</div>
    <div><h3>${escapeHTML(l.title)}</h3><p>${escapeHTML(l.description||"Klik om deze les te openen en je lesmateriaal toe te voegen.")}</p></div>
   </div>
   <span class="tag">${l.done?"✓ Afgerond":"Open les →"}</span>
  </div>`).join(""):`<div class="empty">Je hebt nog geen lessen toegevoegd.<br>Klik op <b>+ Nieuwe les</b> om jouw eerste les te maken.</div>`}
 </div>`;
}

function addLesson(){
 const title=prompt("Wat is de titel van je les?");
 if(!title||!title.trim())return;
 const lesson={id:makeId(),title:title.trim(),description:"",learning:"",material:"",exercises:"",homework:"",summary:"",images:[],done:false};
 lessons.push(lesson);saveData();openLesson(lesson.id);
}
function openLesson(id){
 currentLessonId=id;
 const l=lessons.find(x=>x.id===id);
 if(!l){renderLessons();return;}
 document.getElementById("page").innerHTML=`
 <div class="page-heading">
  <div><h1>${escapeHTML(l.title)}</h1><p class="subtitle">Jouw persoonlijke lesomgeving.</p></div>
  <button class="secondary-button back-button" onclick="openPage('opleiding')">← Terug naar lessen</button>
 </div>
 <div class="panel">
  <div class="section-heading"><h2>Lesinformatie</h2><span class="tag">${l.done?"✓ Afgerond":"In bewerking"}</span></div>
  <div class="form-field"><label>Naam van de les</label><input id="lessonTitle" value="${escapeAttr(l.title)}"></div>
  <div class="form-field"><label>Korte omschrijving</label><input id="lessonDescription" value="${escapeAttr(l.description)}" placeholder="Waar gaat deze les over?"></div>
 </div>
 <div class="editor-section">
  <div class="editor-section-head"><div class="editor-icon">🎯</div><div><h3>1. Wat ga je leren?</h3><small>De leerdoelen van deze les</small></div></div>
  <div class="form-field"><textarea id="learning" placeholder="Wat wil je na deze les kunnen of begrijpen?">${escapeHTML(l.learning)}</textarea></div>
 </div>
 <div class="editor-section">
  <div class="editor-section-head"><div class="editor-icon">📖</div><div><h3>2. Lesmateriaal</h3><small>Jouw uitleg, aantekeningen en afbeeldingen</small></div></div>
  <div class="form-field"><textarea class="large" id="material" placeholder="Schrijf hier je eigen lesmateriaal en uitleg...">${escapeHTML(l.material)}</textarea></div>
  <div class="form-field"><label>Afbeeldingen toevoegen</label><input type="file" id="imageInput" accept="image/*" multiple><small>Je kunt afbeeldingen toevoegen aan je les. Gebruik bij voorkeur kleinere bestanden.</small></div>
  <div class="lesson-images" id="imagePreview">${renderImagePreview(l)}</div>
 </div>
 <div class="editor-section">
  <div class="editor-section-head"><div class="editor-icon">✏️</div><div><h3>3. Oefenopgaven</h3><small>Vragen en opdrachten om te oefenen</small></div></div>
  <div class="form-field"><textarea id="exercises" placeholder="Voeg hier je oefenvragen en opdrachten toe...">${escapeHTML(l.exercises)}</textarea></div>
 </div>
 <div class="editor-section">
  <div class="editor-section-head"><div class="editor-icon">📝</div><div><h3>4. Huiswerk</h3><small>Opdrachten om later te maken</small></div></div>
  <div class="form-field"><textarea id="homework" placeholder="Schrijf hier je huiswerk en eventuele deadlines...">${escapeHTML(l.homework)}</textarea></div>
 </div>
 <div class="editor-section">
  <div class="editor-section-head"><div class="editor-icon">📌</div><div><h3>5. Samenvatting</h3><small>De belangrijkste punten uit deze les</small></div></div>
  <div class="form-field"><textarea id="summary" placeholder="Wat zijn de belangrijkste dingen die je moet onthouden?">${escapeHTML(l.summary)}</textarea></div>
 </div>
 <div class="completion">
  <input type="checkbox" id="lessonDone" ${l.done?"checked":""}>
  <label for="lessonDone">Ik heb deze les afgerond</label>
 </div>
 <div class="actions">
  <button class="orange-button" onclick="saveLesson()">Les opslaan</button>
  <button class="secondary-button" onclick="deleteLesson('${l.id}')">Les verwijderen</button>
  <button class="secondary-button" onclick="openPage('opleiding')">Terug naar overzicht</button>
 </div>`;
 document.getElementById("imageInput").addEventListener("change",handleImages);
 window.scrollTo(0,0);
}
function renderImagePreview(l){
 return (l.images||[]).map((src,i)=>`<div class="image-item"><img src="${src}" alt="Lesafbeelding"><button onclick="removeImage(${i})" type="button">×</button></div>`).join("");
}
function handleImages(event){
 const files=Array.from(event.target.files||[]);
 const l=lessons.find(x=>x.id===currentLessonId);
 files.forEach(file=>{
  if(!file.type.startsWith("image/"))return;
  if(file.size>2*1024*1024){alert("Deze afbeelding is groter dan 2 MB. Kies een kleinere afbeelding.");return;}
  const reader=new FileReader();
  reader.onload=()=>{
   l.images.push(reader.result);
   document.getElementById("imagePreview").innerHTML=renderImagePreview(l);
  };
  reader.readAsDataURL(file);
 });
 event.target.value="";
}
function removeImage(index){
 const l=lessons.find(x=>x.id===currentLessonId);
 l.images.splice(index,1);
 document.getElementById("imagePreview").innerHTML=renderImagePreview(l);
}
function saveLesson(){
 const l=lessons.find(x=>x.id===currentLessonId);
 if(!l)return;
 l.title=document.getElementById("lessonTitle").value.trim()||"Naamloze les";
 l.description=document.getElementById("lessonDescription").value;
 l.learning=document.getElementById("learning").value;
 l.material=document.getElementById("material").value;
 l.exercises=document.getElementById("exercises").value;
 l.homework=document.getElementById("homework").value;
 l.summary=document.getElementById("summary").value;
 l.done=document.getElementById("lessonDone").checked;
 if(l.done&&!completed.includes(l.id))completed.push(l.id);
 if(!l.done)completed=completed.filter(x=>x!==l.id);
 try{saveData();}catch(e){alert("Opslaan is niet gelukt. Mogelijk is je browseropslag vol. Probeer een kleinere afbeelding.");return;}
 alert("Je les is opgeslagen!");
 openLesson(l.id);
}
function deleteLesson(id){
 if(!confirm("Weet je zeker dat je deze les wilt verwijderen?"))return;
 lessons=lessons.filter(l=>l.id!==id);
 completed=completed.filter(x=>x!==id);
 saveData();openPage("opleiding");
}
function openTopic(i){
 const x=techniek[i];
 document.getElementById("page").innerHTML=`
 <div class="page-heading"><div><h1>${x[0]}</h1><p class="subtitle">Fietstechniek / ${x[0]}</p></div>
 <button class="secondary-button" onclick="openPage('techniek')">← Terug</button></div>
 <div class="panel"><h2>Onderwerpen</h2><p class="muted">${x[2]}</p>
 <div class="empty">Dit onderdeel gaan we later verder ontwikkelen.</div></div>`;
}
function escapeHTML(s){
