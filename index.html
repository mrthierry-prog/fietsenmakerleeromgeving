
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fietsenmaker Academie</title>
<style>
:root {
  --bg:#111416;
  --panel:#1b2023;
  --panel2:#22292d;
  --line:#30393e;
  --text:#f2f4f5;
  --muted:#9ba6ac;
  --orange:#ff762b;
  --green:#42bd83;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer}
.layout{display:flex;min-height:100vh}
.sidebar{width:255px;background:#171c1f;border-right:1px solid var(--line);padding:24px 15px;flex-shrink:0}
.brand{font-size:19px;font-weight:900;letter-spacing:1px;padding:8px 10px 28px}
.brand span{color:var(--orange)}
.nav-label{font-size:10px;color:#78848a;font-weight:bold;letter-spacing:1.5px;padding:15px 11px 8px}
.nav button{display:flex;width:100%;gap:12px;align-items:center;text-align:left;background:transparent;color:#b7c0c4;border:0;padding:11px;border-radius:7px;margin:2px 0;font-size:13px}
.nav button:hover,.nav button.active{background:#292f32;color:white}
.nav button.active{border-left:3px solid var(--orange);padding-left:8px}
.nav-icon{width:20px;text-align:center;font-size:16px}
.main{flex:1;min-width:0;padding:30px 38px 60px;max-width:1600px;margin:0 auto;width:100%}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}
.breadcrumb{color:var(--muted);font-size:12px}
.status{font-size:11px;color:var(--green);background:#183328;padding:8px 12px;border-radius:5px}
h1{font-size:29px;margin:0 0 9px;letter-spacing:-.5px}
h2{font-size:18px;margin:0 0 16px}
h3{font-size:15px;margin:0 0 8px}
p{color:var(--muted);line-height:1.6;font-size:13px}
.page-intro{margin-bottom:27px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:22px 0}
.stat{background:var(--panel);border:1px solid var(--line);padding:18px;border-radius:9px}
.stat strong{font-size:25px;display:block;margin-bottom:5px}
.stat span{font-size:11px;color:var(--muted)}
.progress{height:7px;background:#343d42;border-radius:10px;overflow:hidden;margin:12px 0}
.progress div{height:100%;background:var(--orange);border-radius:10px}
.btn{border:1px solid var(--line);background:#293135;color:white;padding:10px 14px;border-radius:6px;font-size:12px;font-weight:bold}
.btn:hover{background:#354046}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#171717}
.btn.primary:hover{background:#ff914f}
.btn.danger{color:#ff8c80;border-color:#6a3834}
.btn.small{padding:7px 10px;font-size:11px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.lesson-card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:18px 20px;margin-bottom:11px;display:flex;align-items:center;gap:14px;transition:.15s}
.lesson-card:hover{border-color:#59666d;transform:translateY(-1px)}
.lesson-number{background:#30383c;color:var(--orange);font-weight:bold;padding:12px;border-radius:6px;min-width:43px;text-align:center}
.lesson-info{flex:1;min-width:0;cursor:pointer}
.lesson-info strong{font-size:14px;display:block;margin-bottom:5px}
.lesson-info small{font-size:11px;color:var(--muted)}
.lesson-info .completed{color:var(--green)}
.lesson-check{width:20px;height:20px;accent-color:var(--green);cursor:pointer}
.lesson-open{color:var(--orange);font-size:12px;font-weight:bold}
.empty{padding:35px;text-align:center;border:1px dashed #465158;border-radius:8px;color:var(--muted);font-size:13px}
.empty .symbol{font-size:34px;margin-bottom:12px}
.field{margin:15px 0}
.field label{display:block;font-size:12px;font-weight:bold;margin-bottom:8px;color:#cbd2d5}
.field input,.field textarea{width:100%;background:#111719;border:1px solid #3a454b;color:white;padding:12px;border-radius:6px;outline:none}
.field input:focus,.field textarea:focus{border-color:var(--orange)}
.field textarea{min-height:320px;resize:vertical;line-height:1.7}
.field input:disabled{opacity:.6}
.editor-toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.editor-toolbar button{background:#293135;border:1px solid var(--line);color:white;border-radius:4px;padding:7px 10px;font-size:11px}
.editor-toolbar button:hover{border-color:var(--orange)}
.file-list{display:grid;gap:10px;margin-top:12px}
.file-item{background:#111719;border:1px solid var(--line);padding:10px;border-radius:6px;font-size:12px}
.file-item img{max-width:100%;max-height:260px;display:block;margin:8px 0;border-radius:5px}
.file-item-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.file-input{display:none}
.lesson-content{line-height:1.8;color:#d4dadd;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.lesson-content img{max-width:100%;border-radius:8px;margin:12px 0}
.lesson-content h2{margin-top:25px}
.lesson-content a{color:var(--orange)}
.module-card{background:var(--panel);border:1px solid var(--line);padding:20px;border-radius:9px;min-height:135px}
.module-card .symbol{font-size:25px;margin-bottom:13px}
.module-card strong{font-size:14px}
.module-card p{font-size:12px;margin-bottom:0}
.back{color:var(--orange);font-size:12px;cursor:pointer;margin-bottom:20px;display:inline-block}
.muted{color:var(--muted)}
.toast{position:fixed;bottom:22px;right:22px;background:#263b32;border:1px solid #35664e;color:#a7f0c9;padding:13px 18px;border-radius:7px;font-size:12px;display:none;z-index:10}
@media(max-width:800px){
 .sidebar{width:70px;padding:15px 8px}
 .brand{font-size:0;padding:8px 0 20px;text-align:center}
 .brand:after{content:"FA";font-size:17px;color:var(--orange)}
 .nav-label{display:none}
 .nav button{justify-content:center;font-size:0;padding:13px 4px}
 .nav-icon{font-size:18px}
 .main{padding:22px 15px}
 .grid{grid-template-columns:1fr}
 .stats{grid-template-columns:1fr}
 .lesson-card{gap:9px;padding:13px}
 .lesson-open{display:none}
}
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar">
  <div class="brand">FIETS<span>ACADEMIE</span></div>
  <nav class="nav">
    <div class="nav-label">HOOFDMENU</div>
    <button class="active" data-page="dashboard"><span class="nav-icon">⌂</span>Dashboard</button>
    <div class="nav-label">OPLEIDING</div>
    <button data-page="opleiding"><span class="nav-icon">▤</span>Mijn opleiding</button>
    <button data-page="techniek"><span class="nav-icon">⚙</span>Fietstechniek</button>
    <button data-page="reparaties"><span class="nav-icon">🔧</span>Reparaties</button>
    <button data-page="notities"><span class="nav-icon">✎</span>Mijn notities</button>
    <button data-page="praktijk"><span class="nav-icon">▣</span>Praktijk & werkzaamheden</button>
    <div class="nav-label">PLANNING</div>
    <button data-page="planning"><span class="nav-icon">▦</span>Planning & voortgang</button>
    <button data-page="oefenen"><span class="nav-icon">✓</span>Oefenen & toetsen</button>
    <button data-page="bestanden"><span class="nav-icon">▧</span>Bestanden</button>
  </nav>
</aside>

<main class="main">
  <div class="topbar">
    <div class="breadcrumb" id="breadcrumb">FIETSACADEMIE / DASHBOARD</div>
    <div class="status">● Lokaal opgeslagen</div>
  </div>
  <div id="app"></div>
</main>
</div>
<div class="toast" id="toast"></div>

<script>
const KEY = "fietsacademie_data_v3";
const OLD_KEY = "fietsacademie_data_v2";

function loadData(){
  try{
    const current=localStorage.getItem(KEY);
    if(current)return JSON.parse(current);
    const old=JSON.parse(localStorage.getItem(OLD_KEY)||"null");
    if(old && Array.isArray(old.chapters)){
      const lessons=[];
      old.chapters.forEach(chapter=>{
        (chapter.lessons||[]).forEach(lesson=>{
          lessons.push({
            id:lesson.id||uid(),
            title:lesson.title||"Nieuwe les",
            content:lesson.content||"",
            subtitle:lesson.subtitle||"",
            files:lesson.files||[],
            done:!!lesson.done
          });
        });
      });
      return {lessons};
    }
  }catch(e){}
  return {lessons:[]};
}
let data=loadData();
if(!Array.isArray(data.lessons))data.lessons=[];
let currentPage="dashboard";
let editingLesson=null;
let currentLesson=null;
let lessonFiles=[];

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function save(){
  try{
    localStorage.setItem(KEY,JSON.stringify(data));
    updateDashboardIfVisible();
  }catch(e){
    notify("Opslagruimte vol. Verwijder eventueel een grote afbeelding.");
  }
}
function notify(message){
  const el=document.getElementById("toast");
  el.textContent=message;
  el.style.display="block";
  clearTimeout(window.toastTimer);
  window.toastTimer=setTimeout(()=>el.style.display="none",2500);
}
function escapeHtml(s){
  return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function escapeAttr(s){return escapeHtml(s)}
function progress(){
  return data.lessons.length?Math.round(data.lessons.filter(l=>l.done).length/data.lessons.length*100):0;
}
function updateDashboardIfVisible(){
  if(currentPage==="dashboard")renderDashboard();
  if(currentPage==="opleiding")renderOpleiding();
}
function go(page){
  currentPage=page;
  currentLesson=null;
  document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
  document.getElementById("breadcrumb").textContent="FIETSACADEMIE / "+page.toUpperCase();
  render();
}
document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>go(b.dataset.page)));

function render(){
  if(currentPage==="dashboard")renderDashboard();
  else if(currentPage==="opleiding")renderOpleiding();
  else if(currentPage==="les-editor")renderLessonEditor();
  else if(currentPage==="les-bekijken")renderLessonView();
  else renderPlaceholder();
}

function renderDashboard(){
 const lessons=data.lessons;
 const done=lessons.filter(l=>l.done).length;
 const p=progress();
 const next=lessons.find(l=>!l.done);
 document.getElementById("app").innerHTML=`
 <div class="page-intro">
  <h1>Welkom in jouw fietsenmakeracademie!</h1>
  <p>Jouw persoonlijke leeromgeving voor fietstechniek, reparaties en praktijk.</p>
 </div>
 <div class="stats">
  <div class="stat"><strong>${lessons.length}</strong><span>MIJN LESSEN</span></div>
  <div class="stat"><strong>${done}</strong><span>AFGERONDE LESSEN</span></div>
  <div class="stat"><strong>${p}%</strong><span>OPLEIDINGSVOORTGANG</span></div>
 </div>
 <div class="panel">
  <h2>Mijn opleiding</h2>
  <p>Je totale cursusvoortgang</p>
  <div class="progress"><div style="width:${p}%"></div></div>
  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
   <span class="muted" style="font-size:12px">${done} van ${lessons.length} lessen afgerond</span>
   <button class="btn primary" onclick="go('opleiding')">Naar mijn opleiding →</button>
  </div>
 </div>
 ${next?`<div class="panel">
  <h2>Verder leren</h2>
  <p>Ga verder met de volgende les op je lijst.</p>
  <strong>${escapeHtml(next.title)}</strong>
  <div style="margin-top:15px"><button class="btn primary" onclick="openLesson('${next.id}')">Les openen →</button></div>
 </div>`:""}
 <div class="grid">
  <div class="module-card"><div class="symbol">⚙</div><strong>Fietstechniek</strong><p>Leer meer over onderdelen, systemen en de werking van fietsen.</p></div>
  <div class="module-card"><div class="symbol">🔧</div><strong>Reparaties</strong><p>Verzamel je eigen reparatiehandleidingen en stappenplannen.</p></div>
  <div class="module-card"><div class="symbol">✎</div><strong>Mijn notities</strong><p>Bewaar je eigen samenvattingen en technische aantekeningen.</p></div>
  <div class="module-card"><div class="symbol">▦</div><strong>Planning & voortgang</strong><p>Houd overzicht over je leerdoelen en cursusvoortgang.</p></div>
 </div>`;
}

function renderOpleiding(){
 const lessons=data.lessons;
 const done=lessons.filter(l=>l.done).length;
 document.getElementById("app").innerHTML=`
 <div class="page-intro">
  <h1>Mijn opleiding</h1>
  <p>Jouw persoonlijke overzicht van alle lessen. Voeg zelf lessen toe en bouw je eigen cursusmap op.</p>
 </div>
 <div class="panel">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
   <div><h2>Mijn lessen</h2><p style="margin:0">${lessons.length} lessen · ${done} afgerond · ${progress()}% voltooid</p></div>
   <button class="btn primary" onclick="newLesson()">＋ Nieuwe les toevoegen</button>
  </div>
  <div class="progress"><div style="width:${progress()}%"></div></div>
 </div>
 <div>
 ${lessons.length?lessons.map((l,i)=>`
  <div class="lesson-card">
   <div class="lesson-number">${String(i+1).padStart(2,"0")}</div>
   <div class="lesson-info" onclick="openLesson('${l.id}')">
    <strong>${escapeHtml(l.title)}</strong>
    <small class="${l.done?"completed":""}">${l.done?"✓ Afgerond":(l.subtitle?escapeHtml(l.subtitle):"Klik om je les te openen")}</small>
   </div>
   <input class="lesson-check" title="Markeer als afgerond" type="checkbox" ${l.done?"checked":""} onchange="toggleDone('${l.id}')">
   <span class="lesson-open" onclick="openLesson('${l.id}')">Open les →</span>
   <button class="btn small" title="Bewerken" onclick="editLesson('${l.id}')">✎</button>
   <button class="btn small danger" title="Verwijderen" onclick="deleteLesson('${l.id}')">×</button>
  </div>`).join(""):`
  <div class="empty">
   <div class="symbol">▤</div>
   <strong>Je hebt nog geen lessen toegevoegd</strong>
   <p>Maak je eerste les aan en begin met het opbouwen van je eigen cursus.</p>
   <button class="btn primary" onclick="newLesson()">＋ Eerste les toevoegen</button>
  </div>`}
 </div>`;
}

function newLesson(){
 editingLesson=null;
 lessonFiles=[];
 currentPage="les-editor";
 renderLessonEditor();
}
function editLesson(id){
 editingLesson=id;
 const l=data.lessons.find(x=>x.id===id);
 if(!l)return;
 lessonFiles=[...(l.files||[])];
 currentPage="les-editor";
 renderLessonEditor();
}
function renderLessonEditor(){
 const l=editingLesson?data.lessons.find(x=>x.id===editingLesson):null;
 document.getElementById("app").innerHTML=`
 <div class="editor-layout">
  <span class="back" onclick="go('opleiding')">← Terug naar mijn opleiding</span>
  <div class="page-intro">
   <h1>${l?"Les bewerken":"Nieuwe les maken"}</h1>
   <p>Maak je eigen lespagina en voeg je lesmateriaal toe.</p>
  </div>
  <div class="panel">
   <div class="field">
    <label>Naam van de les</label>
    <input id="lessonTitle" placeholder="Bijvoorbeeld: De basis van de fiets" value="${l?escapeAttr(l.title):""}">
   </div>
   <div class="field">
    <label>Korte omschrijving (optioneel)</label>
    <input id="lessonSubtitle" placeholder="Waar gaat deze les over?" value="${l?escapeAttr(l.subtitle||""):""}">
   </div>
   <div class="field">
    <label>Mijn lesmateriaal</label>
    <div class="editor-toolbar">
     <button onclick="formatText('bold')"><b>Vet</b></button>
     <button onclick="formatText('italic')"><i>Schuin</i></button>
     <button onclick="insertHeading()">Kop toevoegen</button>
     <button onclick="insertList()">Opsomming</button>
    </div>
    <textarea id="lessonContent" placeholder="Typ hier zelf de inhoud van je les...">${l?escapeHtml(l.content||""):""}</textarea>
    <p>Hier kun je zelf uitleg, aantekeningen, begrippen en samenvattingen typen.</p>
   </div>
   <div class="field">
    <label>Afbeeldingen toevoegen</label>
    <input class="file-input" id="fileUpload" type="file" accept="image/*" multiple onchange="addFiles(event)">
    <button class="btn" onclick="document.getElementById('fileUpload').click()">＋ Afbeeldingen kiezen</button>
    <div class="file-list" id="fileList">${renderFileList()}</div>
    <p>Afbeeldingen worden bij deze les bewaard. Kies bij voorkeur afbeeldingen van maximaal 3 MB per stuk.</p>
   </div>
   <div class="actions">
    <button class="btn primary" onclick="saveLesson()">Les opslaan</button>
    <button class="btn" onclick="go('opleiding')">Annuleren</button>
   </div>
  </div>
 </div>`;
}
function renderFileList(){
 return lessonFiles.map((f,i)=>`
 <div class="file-item">
  <div class="file-item-top">
   <strong>🖼 ${escapeHtml(f.name)}</strong>
   <button class="btn small danger" onclick="removeFile(${i})">Verwijderen</button>
  </div>
  <img src="${f.data}" alt="${escapeAttr(f.name)}">
 </div>`).join("");
}
function addFiles(event){
 const files=Array.from(event.target.files);
 files.forEach(file=>{
  if(!file.type.startsWith("image/"))return;
  if(file.size>3*1024*1024){
   notify(file.name+" is groter dan 3 MB.");
   return;
  }
  const reader=new FileReader();
  reader.onload=()=>{
   lessonFiles.push({name:file.name,type:file.type,data:reader.result});
   const list=document.getElementById("fileList");
   if(list)list.innerHTML=renderFileList();
  };
  reader.readAsDataURL(file);
 });
 event.target.value="";
}
function removeFile(i){
 lessonFiles.splice(i,1);
 const list=document.getElementById("fileList");
 if(list)list.innerHTML=renderFileList();
}
function formatText(type){
 const el=document.getElementById("lessonContent");
 const start=el.selectionStart,end=el.selectionEnd;
 const selected=el.value.slice(start,end)||"tekst";
 const wrapped=type==="bold"?"**"+selected+"**":"*"+selected+"*";
 el.setRangeText(wrapped,start,end,"select");
 el.focus();
}
function insertHeading(){
 const el=document.getElementById("lessonContent");
 const start=el.selectionStart;
 el.setRangeText("\n\n## Nieuwe kop\n",start,start,"end");
 el.focus();
}
function insertList(){
 const el=document.getElementById("lessonContent");
 const start=el.selectionStart;
 el.setRangeText("\n- Eerste punt\n- Tweede punt\n- Derde punt\n",start,start,"end");
 el.focus();
}
function saveLesson(){
 const title=document.getElementById("lessonTitle").value.trim();
 if(!title){notify("Vul eerst een naam voor je les in.");return}
 const subtitle=document.getElementById("lessonSubtitle").value.trim();
 const content=document.getElementById("lessonContent").value;
 if(editingLesson){
  const l=data.lessons.find(x=>x.id===editingLesson);
  if(!l)return;
  Object.assign(l,{title,subtitle,content,files:lessonFiles});
 }else{
  data.lessons.push({id:uid(),title,subtitle,content,files:lessonFiles,done:false});
 }
 save();
 notify("Je les is opgeslagen!");
 go("opleiding");
}
function deleteLesson(id){
 const l=data.lessons.find(x=>x.id===id);
 if(!l)return;
 if(!confirm('Weet je zeker dat je "'+l.title+'" wilt verwijderen?'))return;
 data.lessons=data.lessons.filter(x=>x.id!==id);
 save();
 renderOpleiding();
 notify("Les verwijderd.");
}
function toggleDone(id){
 const l=data.lessons.find(x=>x.id===id);
 if(!l)return;
 l.done=!l.done;
 save();
 if(currentPage==="opleiding")renderOpleiding();
}
function openLesson(id){
 currentLesson=id;
 currentPage="les-bekijken";
 renderLessonView();
}
function renderLessonView(){
 const l=data.lessons.find(x=>x.id===currentLesson);
 if(!l){go("opleiding");return}
 document.getElementById("app").innerHTML=`
 <span class="back" onclick="go('opleiding')">← Terug naar mijn opleiding</span>
 <div class="page-intro">
  <p>MIJN OPLEIDING / LES</p>
  <h1>${escapeHtml(l.title)}</h1>
  <p>${escapeHtml(l.subtitle||"")}</p>
 </div>
 <div class="panel">
  <div class="lesson-content">${formatContent(l.content||"Je hebt nog geen lesmateriaal geschreven. Klik op bewerken om te beginnen.")}</div>
  ${(l.files||[]).map(f=>`<div style="margin-top:18px"><img src="${f.data}" alt="${escapeAttr(f.name)}" style="max-width:100%;max-height:500px;border-radius:8px"><p>${escapeHtml(f.name)}</p></div>`).join("")}
  <div class="actions" style="margin-top:28px;padding-top:18px;border-top:1px solid var(--line)">
   <button class="btn primary" onclick="toggleDone('${l.id}');renderLessonView()">${l.done?"✓ Afgerond – ongedaan maken":"Les als afgerond markeren"}</button>
   <button class="btn" onclick="editLesson('${l.id}')">✎ Les bewerken</button>
  </div>
 </div>`;
}
function formatContent(text){
 return escapeHtml(text)
  .replace(/^### (.*)$/gm,"<h3>$1</h3>")
  .replace(/^## (.*)$/gm,"<h2>$1</h2>")
  .replace(/^# (.*)$/gm,"<h2>$1</h2>")
  .replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>")
  .replace(/\*(.*?)\*/g,"<em>$1</em>")
  .replace(/^- (.*)$/gm,"• $1")
  .replace(/\n/g,"<br>");
}
function renderPlaceholder(){
 const names={
  techniek:"Fietstechniek",
  reparaties:"Reparaties",
  notities:"Mijn notities",
  praktijk:"Praktijk & werkzaamheden",
  planning:"Planning & voortgang",
  oefenen:"Oefenen & toetsen",
  bestanden:"Bestanden"
 };
 document.getElementById("app").innerHTML=`
 <div class="page-intro"><h1>${names[currentPage]||currentPage}</h1><p>Dit onderdeel gaan we later samen verder opbouwen.</p></div>
