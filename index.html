
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fietsenmaker Academie</title>
<style>
:root {
  --bg:#111416;
  --panel:#1b2023;
  --panel2:#22292d;
  --line:#30393e;
  --text:#f2f4f5;
  --muted:#9ba6ac;
  --orange:#ff762b;
  --orange2:#ff914f;
  --green:#42bd83;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer}
.layout{display:flex;min-height:100vh}
.sidebar{width:255px;background:#171c1f;border-right:1px solid var(--line);padding:24px 15px;flex-shrink:0}
.brand{font-size:19px;font-weight:900;letter-spacing:1px;padding:8px 10px 28px}
.brand span{color:var(--orange)}
.nav-label{font-size:10px;color:#78848a;font-weight:bold;letter-spacing:1.5px;padding:15px 11px 8px}
.nav button{display:flex;width:100%;gap:12px;align-items:center;text-align:left;background:transparent;color:#b7c0c4;border:0;padding:11px;border-radius:7px;margin:2px 0;font-size:13px}
.nav button:hover,.nav button.active{background:#292f32;color:white}
.nav button.active{border-left:3px solid var(--orange);padding-left:8px}
.nav-icon{width:20px;text-align:center;font-size:16px}
.main{flex:1;min-width:0;padding:30px 38px 60px;max-width:1600px;margin:0 auto;width:100%}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}
.breadcrumb{color:var(--muted);font-size:12px}
.status{font-size:11px;color:var(--green);background:#183328;padding:8px 12px;border-radius:5px}
h1{font-size:29px;margin:0 0 9px;letter-spacing:-.5px}
h2{font-size:18px;margin:0 0 16px}
h3{font-size:15px;margin:0 0 8px}
p{color:var(--muted);line-height:1.6;font-size:13px}
.page-intro{margin-bottom:27px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:22px 0}
.stat{background:var(--panel);border:1px solid var(--line);padding:18px;border-radius:9px}
.stat strong{font-size:25px;display:block;margin-bottom:5px}
.stat span{font-size:11px;color:var(--muted)}
.progress{height:7px;background:#343d42;border-radius:10px;overflow:hidden;margin:12px 0}
.progress div{height:100%;background:var(--orange);border-radius:10px}
.btn{border:1px solid var(--line);background:#293135;color:white;padding:10px 14px;border-radius:6px;font-size:12px;font-weight:bold}
.btn:hover{background:#354046}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#171717}
.btn.primary:hover{background:var(--orange2)}
.btn.danger{color:#ff8c80;border-color:#6a3834}
.btn.small{padding:7px 10px;font-size:11px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.chapter{background:var(--panel);border:1px solid var(--line);border-radius:9px;margin-bottom:13px;overflow:hidden}
.chapter-head{padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.chapter-title{display:flex;align-items:center;gap:13px;min-width:0}
.chapter-number{background:#30383c;color:var(--orange);font-weight:bold;padding:10px 12px;border-radius:6px}
.chapter-info{min-width:0}
.chapter-info strong{font-size:14px}
.chapter-info small{display:block;color:var(--muted);font-size:11px;margin-top:5px}
.chapter-content{border-top:1px solid var(--line);padding:10px 20px 17px}
.lesson{display:flex;align-items:center;gap:12px;padding:12px 5px;border-bottom:1px solid #30383c}
.lesson:last-child{border:0}
.lesson-check{width:19px;height:19px;accent-color:var(--green);flex-shrink:0}
.lesson-name{flex:1;min-width:0}
.lesson-name strong{font-size:13px;display:block}
.lesson-name small{font-size:11px;color:var(--muted)}
.done{color:var(--green)!important}
.lesson-buttons{display:flex;gap:6px}
.empty{padding:28px;text-align:center;border:1px dashed #465158;border-radius:8px;color:var(--muted);font-size:13px}
.field{margin:15px 0}
.field label{display:block;font-size:12px;font-weight:bold;margin-bottom:8px;color:#cbd2d5}
.field input,.field textarea{width:100%;background:#111719;border:1px solid #3a454b;color:white;padding:12px;border-radius:6px;outline:none}
.field input:focus,.field textarea:focus{border-color:var(--orange)}
.field textarea{min-height:260px;resize:vertical;line-height:1.6}
.editor-toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.editor-toolbar button{background:#293135;border:1px solid var(--line);color:white;border-radius:4px;padding:7px 10px;font-size:11px}
.editor-toolbar button:hover{border-color:var(--orange)}
.file-list{display:grid;gap:8px;margin-top:12px}
.file-item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#111719;border:1px solid var(--line);padding:10px;border-radius:6px;font-size:12px}
.file-item a{color:var(--orange)}
.file-input{display:none}
.lesson-view{line-height:1.8;color:#d4dadd;font-size:14px}
.lesson-view img{max-width:100%;border-radius:8px;margin:12px 0}
.lesson-view h1,.lesson-view h2,.lesson-view h3{margin-top:20px}
.lesson-view a{color:var(--orange)}
.editor-layout{max-width:950px}
.back{color:var(--orange);font-size:12px;cursor:pointer;margin-bottom:20px;display:inline-block}
.muted{color:var(--muted)}
.module-card{background:var(--panel);border:1px solid var(--line);padding:20px;border-radius:9px;min-height:135px}
.module-card .symbol{font-size:25px;margin-bottom:13px}
.module-card strong{font-size:14px}
.module-card p{font-size:12px;margin-bottom:0}
.toast{position:fixed;bottom:22px;right:22px;background:#263b32;border:1px solid #35664e;color:#a7f0c9;padding:13px 18px;border-radius:7px;font-size:12px;display:none;z-index:10}
@media(max-width:800px){
 .sidebar{width:70px;padding:15px 8px}
 .brand{font-size:0;padding:8px 0 20px;text-align:center}
 .brand:after{content:"FA";font-size:17px;color:var(--orange)}
 .nav-label{display:none}
 .nav button{justify-content:center;font-size:0;padding:13px 4px}
 .nav-icon{font-size:18px}
 .main{padding:22px 15px}
 .grid{grid-template-columns:1fr}
 .stats{grid-template-columns:1fr}
 .chapter-head{align-items:flex-start}
 .chapter-head>.actions{flex-direction:column}
 .lesson-buttons .edit-label{display:none}
}
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar">
  <div class="brand">FIETS<span>ACADEMIE</span></div>
  <nav class="nav">
    <div class="nav-label">HOOFDMENU</div>
    <button class="active" data-page="dashboard"><span class="nav-icon">⌂</span>Dashboard</button>
    <div class="nav-label">OPLEIDING</div>
    <button data-page="opleiding"><span class="nav-icon">▤</span>Mijn opleiding</button>
    <button data-page="techniek"><span class="nav-icon">⚙</span>Fietstechniek</button>
    <button data-page="reparaties"><span class="nav-icon">🔧</span>Reparaties</button>
    <button data-page="notities"><span class="nav-icon">✎</span>Mijn notities</button>
    <button data-page="praktijk"><span class="nav-icon">▣</span>Praktijk & werkzaamheden</button>
    <div class="nav-label">PLANNING</div>
    <button data-page="planning"><span class="nav-icon">▦</span>Planning & voortgang</button>
    <button data-page="oefenen"><span class="nav-icon">✓</span>Oefenen & toetsen</button>
    <button data-page="bestanden"><span class="nav-icon">▧</span>Bestanden</button>
  </nav>
</aside>
<main class="main">
  <div class="topbar">
    <div class="breadcrumb" id="breadcrumb">FIETSACADEMIE / DASHBOARD</div>
    <div class="status">● Lokaal opgeslagen</div>
  </div>
  <div id="app"></div>
</main>
</div>
<div class="toast" id="toast"></div>

<script>
const KEY = "fietsacademie_data_v2";
let data = JSON.parse(localStorage.getItem(KEY) || '{"chapters":[]}');
let currentPage = "dashboard";
let editingLesson = null;
let editingChapter = null;
let openChapters = {};
let currentLesson = null;
let lessonFiles = [];
let db;

function save(){
  localStorage.setItem(KEY,JSON.stringify(data));
  updateDashboardIfVisible();
}
function notify(message){
  const el=document.getElementById("toast");
  el.textContent=message;
  el.style.display="block";
  setTimeout(()=>el.style.display="none",2300);
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function allLessons(){return data.chapters.flatMap(c=>c.lessons||[])}
function progress(){
  const lessons=allLessons();
  return lessons.length?Math.round(lessons.filter(l=>l.done).length/lessons.length*100):0;
}
function updateDashboardIfVisible(){
  if(currentPage==="dashboard") renderDashboard();
  if(currentPage==="opleiding") renderOpleiding();
}
function go(page){
  currentPage=page;
  currentLesson=null;
  document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
  document.getElementById("breadcrumb").textContent="FIETSACADEMIE / "+page.toUpperCase();
  render();
}
document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>go(b.dataset.page)));

function render(){
  if(currentPage==="dashboard")renderDashboard();
  else if(currentPage==="opleiding")renderOpleiding();
  else if(currentPage==="les-editor")renderLessonEditor();
  else if(currentPage==="les-bekijken")renderLessonView();
  else if(currentPage==="hoofdstuk-editor")renderChapterEditor();
  else renderPlaceholder();
}
function renderDashboard(){
 const lessons=allLessons(),done=lessons.filter(l=>l.done).length,p=progress();
 document.getElementById("app").innerHTML=`
 <div class="page-intro"><h1>Welkom in jouw fietsenmakeracademie!</h1>
 <p>Jouw persoonlijke leeromgeving voor fietstechniek, reparaties en praktijk.</p></div>
 <div class="stats">
  <div class="stat"><strong>${data.chapters.length}</strong><span>HOOFDSTUKKEN</span></div>
  <div class="stat"><strong>${lessons.length}</strong><span>LESSEN</span></div>
  <div class="stat"><strong>${p}%</strong><span>OPLEIDINGSVOORTGANG</span></div>
 </div>
 <div class="panel">
  <h2>Mijn opleiding</h2>
  <p>Je totale cursusvoortgang</p>
  <div class="progress"><div style="width:${p}%"></div></div>
  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
   <span class="muted" style="font-size:12px">${done} van ${lessons.length} lessen afgerond</span>
   <button class="btn primary" onclick="go('opleiding')">Ga naar mijn opleiding →</button>
  </div>
 </div>
 <div class="grid">
  <div class="module-card"><div class="symbol">⚙</div><strong>Fietstechniek</strong><p>Leer meer over onderdelen, systemen en de werking van fietsen.</p></div>
  <div class="module-card"><div class="symbol">🔧</div><strong>Reparaties</strong><p>Verzamel je eigen reparatiehandleidingen en stappenplannen.</p></div>
  <div class="module-card"><div class="symbol">✎</div><strong>Mijn notities</strong><p>Bewaar je eigen samenvattingen en technische aantekeningen.</p></div>
  <div class="module-card"><div class="symbol">▦</div><strong>Planning & voortgang</strong><p>Houd overzicht over je leerdoelen en cursusvoortgang.</p></div>
 </div>
 ${lessons.length?`<div class="panel" style="margin-top:18px"><h2>Verder leren</h2>${lessons.filter(l=>!l.done).slice(0,3).map(l=>`<div class="lesson"><div class="lesson-name"><strong>${escapeHtml(l.title)}</strong><small>${escapeHtml(chapterName(l.chapterId))}</small></div><button class="btn small" onclick="openLesson('${l.id}')">Open les</button></div>`).join("")}</div>`:""}
 `;
}
function chapterName(id){return data.chapters.find(c=>c.id===id)?.title||"Hoofdstuk"}
function renderOpleiding(){
 const lessons=allLessons();
 document.getElementById("app").innerHTML=`
 <div class="page-intro"><h1>Mijn opleiding</h1><p>Beheer hier je eigen cursus, hoofdstukken en lesmateriaal.</p></div>
 <div class="panel">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
   <div><h2>Cursusoverzicht</h2><p style="margin:0">${data.chapters.length} hoofdstukken · ${lessons.length} lessen · ${progress()}% afgerond</p></div>
   <button class="btn primary" onclick="newChapter()">＋ Hoofdstuk toevoegen</button>
  </div>
  <div class="progress"><div style="width:${progress()}%"></div></div>
 </div>
 <div id="chapters">
 ${data.chapters.length?data.chapters.map((c,i)=>chapterHtml(c,i)).join(""):`<div class="empty"><div style="font-size:30px;margin-bottom:12px">▤</div><strong>Je cursus is nog leeg</strong><p>Voeg je eerste hoofdstuk toe om te beginnen.</p><button class="btn primary" onclick="newChapter()">＋ Eerste hoofdstuk toevoegen</button></div>`}
 </div>`;
}
function chapterHtml(c,i){
 const ls=c.lessons||[],done=ls.filter(l=>l.done).length;
 return `<section class="chapter">
  <div class="chapter-head">
   <div class="chapter-title" onclick="toggleChapter('${c.id}')" style="cursor:pointer">
    <div class="chapter-number">${String(i+1).padStart(2,"0")}</div>
    <div class="chapter-info"><strong>${escapeHtml(c.title)}</strong><small>${ls.length} lessen · ${done} afgerond</small></div>
   </div>
   <div class="actions">
    <button class="btn small" onclick="event.stopPropagation();newLesson('${c.id}')">＋ Les</button>
    <button class="btn small" onclick="event.stopPropagation();editChapter('${c.id}')">Bewerken</button>
    <button class="btn small danger" onclick="event.stopPropagation();deleteChapter('${c.id}')">Verwijderen</button>
    <button class="btn small" onclick="toggleChapter('${c.id}')">${openChapters[c.id]?"Inklappen":"Openen"}⌄</button>
   </div>
  </div>
  ${openChapters[c.id]?`<div class="chapter-content">
   ${ls.length?ls.map(l=>`<div class="lesson">
    <input class="lesson-check" type="checkbox" ${l.done?"checked":""} onchange="toggleDone('${l.id}')">
    <div class="lesson-name"><strong class="${l.done?"done":""}">${escapeHtml(l.title)}</strong><small>${l.content?"Lesmateriaal beschikbaar":"Nog geen lesmateriaal"}</small></div>
    <div class="lesson-buttons">
     <button class="btn small" onclick="openLesson('${l.id}')">Open</button>
     <button class="btn small" onclick="editLesson('${l.id}')">✎ <span class="edit-label">Bewerken</span></button>
     <button class="btn small danger" onclick="deleteLesson('${l.id}')">×</button>
    </div>
   </div>`).join(""):`<div class="empty">Dit hoofdstuk bevat nog geen lessen.</div>`}
   <button class="btn small" style="margin-top:12px" onclick="newLesson('${c.id}')">＋ Les toevoegen</button>
  </div>`:""}
 </section>`;
}
function toggleChapter(id){openChapters[id]=!openChapters[id];renderOpleiding()}
function newChapter(){editingChapter=null;currentPage="hoofdstuk-editor";renderChapterEditor()}
function editChapter(id){editingChapter=id;currentPage="hoofdstuk-editor";renderChapterEditor()}
function renderChapterEditor(){
 const c=data.chapters.find(x=>x.id===editingChapter);
 document.getElementById("app").innerHTML=`
 <div class="editor-layout"><span class="back" onclick="go('opleiding')">← Terug naar mijn opleiding</span>
 <div class="page-intro"><h1>${c?"Hoofdstuk bewerken":"Nieuw hoofdstuk"}</h1><p>Geef je hoofdstuk een duidelijke naam.</p></div>
 <div class="panel">
  <div class="field"><label>Naam van het hoofdstuk</label><input id="chapterTitle" placeholder="Bijvoorbeeld: De fietsaandrijving" value="${c?escapeAttr(c.title):""}"></div>
  <div class="field"><label>Beschrijving (optioneel)</label><textarea id="chapterDesc" style="min-height:100px" placeholder="Waar gaat dit hoofdstuk over?">${c?escapeHtml(c.description||""):""}</textarea></div>
  <div class="actions"><button class="btn primary" onclick="saveChapter()">Hoofdstuk opslaan</button><button class="btn" onclick="go('opleiding')">Annuleren</button></div>
 </div></div>`;
}
function saveChapter(){
 const title=document.getElementById("chapterTitle").value.trim();
 if(!title){notify("Vul eerst een hoofdstuktitel in.");return}
 const description=document.getElementById("chapterDesc").value;
 if(editingChapter){const c=data.chapters.find(x=>x.id===editingChapter);c.title=title;c.description=description}
 else data.chapters.push({id:uid(),title,description,lessons:[]});
 save();notify("Hoofdstuk opgeslagen!");go("opleiding");
}
function deleteChapter(id){
 const c=data.chapters.find(x=>x.id===id);
 if(!confirm(`Weet je zeker dat je "${c.title}" en alle lessen daarin wilt verwijderen?`))return;
 data.chapters=data.chapters.filter(x=>x.id!==id);save();renderOpleiding();notify("Hoofdstuk verwijderd.");
}
function newLesson(chapterId){editingLesson=null;currentLesson={chapterId};lessonFiles=[];currentPage="les-editor";renderLessonEditor()}
function editLesson(id){
 const found=findLesson(id);if(!found)return;
 editingLesson=id;currentLesson={chapterId:found.chapter.id};lessonFiles=[...(found.lesson.files||[])];currentPage="les-editor";renderLessonEditor();
}
function findLesson(id){
 for(const chapter of data.chapters){const lesson=(chapter.lessons||[]).find(l=>l.id===id);if(lesson)return {chapter,lesson}}
 return null;
}
function renderLessonEditor(){
 const found=editingLesson?findLesson(editingLesson):null;
 const l=found?.lesson;
 document.getElementById("app").innerHTML=`
 <div class="editor-layout"><span class="back" onclick="go('opleiding')">← Terug naar mijn opleiding</span>
 <div class="page-intro"><h1>${l?"Les bewerken":"Nieuwe les maken"}</h1><p>Voeg je eigen lesmateriaal toe aan je opleiding.</p></div>
 <div class="panel">
  <div class="field"><label>Hoofdstuk</label><input value="${escapeAttr(chapterName(currentLesson.chapterId))}" disabled></div>
  <div class="field"><label>Lesnaam</label><input id="lessonTitle" placeholder="Bijvoorbeeld: Werking van een derailleur" value="${l?escapeAttr(l.title):""}"></div>
  <div class="field"><label>Korte omschrijving (optioneel)</label><input id="lessonSubtitle" placeholder="Een korte introductie van deze les" value="${l?escapeAttr(l.subtitle||""):""}"></div>
  <div class="field"><label>Lesmateriaal</label>
   <div class="editor-toolbar">
    <button onclick="formatText('bold')"><b>Vet</b></button>
    <button onclick="formatText('italic')"><i>Schuin</i></button>
    <button onclick="insertHeading()">Kop toevoegen</button>
    <button onclick="insertList()">Opsomming</button>
   </div>
   <textarea id="lessonContent" placeholder="Schrijf hier je lesmateriaal...">${l?escapeHtml(l.content||""):""}</textarea>
   <p>Tip: je kunt hier tekst schrijven, kopjes maken en opsommingen toevoegen.</p>
  </div>
  <div class="field"><label>Afbeeldingen en PDF-bestanden</label>
   <input class="file-input" id="fileUpload" type="file" accept="image/*,.pdf" multiple onchange="addFiles(event)">
   <button class="btn" onclick="document.getElementById('fileUpload').click()">＋ Bestanden toevoegen</button>
   <div class="file-list" id="fileList">${renderFileList()}</div>
   <p>Bestanden worden lokaal in deze browser bewaard. Grote bestanden kunnen de beschikbare opslagruimte overschrijden.</p>
  </div>
  <div class="actions"><button class="btn primary" onclick="saveLesson()">Les opslaan</button><button class="btn" onclick="go('opleiding')">Annuleren</button></div>
 </div></div>`;
}
function renderFileList(){
 return lessonFiles.map((f,i)=>`<div class="file-item"><span>${f.type.startsWith("image/")?"🖼":"📄"} ${escapeHtml(f.name)}</span><button class="btn small danger" onclick="removeFile(${i})">Verwijderen</button></div>`).join("");
}
function addFiles(event){
 const files=Array.from(event.target.files);
 files.forEach(file=>{
  if(file.size>3*1024*1024){notify(file.name+" is groter dan 3 MB en is overgeslagen.");return}
  const reader=new FileReader();
  reader.onload=()=>{lessonFiles.push({name:file.name,type:file.type,data:reader.result});document.getElementById("fileList").innerHTML=renderFileList()};
  reader.readAsDataURL(file);
 });
 event.target.value="";
}
function removeFile(i){lessonFiles.splice(i,1);document.getElementById("fileList").innerHTML=renderFileList()}
function formatText(type){
 const el=document.getElementById("lessonContent");
 const start=el.selectionStart,end=el.selectionEnd;
 const selected=el.value.slice(start,end)||"tekst";
 const wrapped=type==="bold"?"**"+selected+"**":"*"+selected+"*";
 el.setRangeText(wrapped,start,end,"select");el.focus();
}
function insertHeading(){
 const el=document.getElementById("lessonContent");const start=el.selectionStart;
 el.setRangeText("\n\n## Nieuwe kop\n",start,start,"end");el.focus();
}
function insertList(){
 const el=document.getElementById("lessonContent");const start=el.selectionStart;
 el.setRangeText("\n- Eerste punt\n- Tweede punt\n- Derde punt\n",start,start,"end");el.focus();
}
function saveLesson(){
 const title=document.getElementById("lessonTitle").value.trim();
 if(!title){notify("Vul eerst een lestitel in.");return}
 const subtitle=document.getElementById("lessonSubtitle").value;
 const content=document.getElementById("lessonContent").value;
 if(editingLesson){
  const f=findLesson(editingLesson);Object.assign(f.lesson,{title,subtitle,content,files:lessonFiles});
 }else{
  const chapter=data.chapters.find(c=>c.id===currentLesson.chapterId);
  chapter.lessons.push({id:uid(),title,subtitle,content,files:lessonFiles,done:false});
  openChapters[chapter.id]=true;
 }
 save();notify("Les opgeslagen!");go("opleiding");
}
function deleteLesson(id){
 const f=findLesson(id);if(!f)return;
 if(!confirm(`Weet je zeker dat je "${f.lesson.title}" wilt verwijderen?`))return;
 f.chapter.lessons=f.chapter.lessons.filter(l=>l.id!==id);save();renderOpleiding();notify("Les verwijderd.");
}
function toggleDone(id){
 const f=findLesson(id);if(!f)return;
 f.lesson.done=!f.lesson.done;save();renderOpleiding();
}
function openLesson(id){currentLesson={id};currentPage="les-bekijken";renderLessonView()}
function renderLessonView(){
 const f=findLesson(currentLesson.id);if(!f){go("opleiding");return}
 const l=f.lesson;
 document.getElementById("app").innerHTML=`

 <div class="panel">

  </div>

 </div>`;
}
function formatContent(text){
 return escapeHtml(text).replace(/^### (.*)$/gm,"<h3>$1</h3>").replace(/^## (.*)$/gm,"<h2>$1</h2>").replace(/^# (.*)$/gm,"<h1>$1</h1>").replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>").replace(/\*(.*?)\*/g,"<em>$1</em>").replace(/^- (.*)$/gm,"• $1").replace(/\n/g,"<br>");
}
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function escapeAttr(s){return escapeHtml(s).replace(/`/g,"&#96;")}

}
